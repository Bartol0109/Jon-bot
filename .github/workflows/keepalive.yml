# GitHub gasi zakazane workflowe u javnom repozitoriju nakon 60 dana bez
# aktivnosti. Samo pokretanje Actions to ne resetira; commit resetira.
# Ovaj workflow jednom tjedno zapiše datum na main. Ne dira tajne ni data/.
# Ako je workflow već ugašen (disabled_inactivity), sam se ne može upaliti —
# treba Enable workflow u Actions tabu (vidi README).
name: Održavanje rasporeda

on:
  schedule:
    - cron: "20 8 * * 1"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: odrzavanje-rasporeda
  cancel-in-progress: false

jobs:
  keepalive:
    name: keepalive
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Zabilježi aktivnost repozitorija
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          mkdir -p .github
          date -u +%Y-%m-%dT%H:%M:%SZ > .github/keepalive-last.txt
          git add .github/keepalive-last.txt
          git commit -m "chore: keep scheduled workflows active"
          git push
